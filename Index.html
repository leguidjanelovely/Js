<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator App</title>
</head>
<body>
    <h1>Calculator App</h1>

    <table>
        <tr>
            <td><label for="num1">First Number:</label></td>
            <td><input type="number" id="num1" placeholder="Enter first number"></td>
        </tr>
        <tr>
            <td><label for="num2">Second Number:</label></td>
            <td><input type="number" id="num2" placeholder="Enter second number"></td>
        </tr>
        <tr>
            <td></td>
            <td>
                <button onclick="calculate()">Calculate</button>
                <button onclick="clearEntries()">Clear Entries</button>
            </td>
        </tr>
    </table>

    <p font-weight: bold;"><strong>Results:</strong></p>
    <p>Sum: <span id="sum"></span></p>
    <p>Minus: <span id="minus"></span></p>
    <p>Times: <span id="times"></span></p>
    <p>Divide: <span id="divide"></span></p>

    <script src="main.js"></script>
</body>
</html>
